# AAPS graph UI experiment. This file is intended ONLY for the
# aaps-4-graph-test branch, never the normal master branch.
# Unlike the original Branch CI, this version does not read signing
# secrets, contact Google Drive, or remove existing APKs.
name: Branch CI

on:
  workflow_dispatch:
    inputs:
      buildVariant:
        description: 'Select Build Variant (graph-test branch only)'
        required: true
        default: 'fullDebug'
        type: choice
        options:
          - fullDebug

permissions:
  contents: read

jobs:
  build:
    name: Build experimental AAPS UI (debug only)
    if: github.ref == 'refs/heads/aaps-4-graph-test'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the selected test branch
        uses: actions/checkout@v4

      - name: Verify this is the UI-only test branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aaps-4-graph-test"
          test "${{ github.event.inputs.buildVariant }}" = "fullDebug"
          echo "Building commit $(git rev-parse --short HEAD) on branch $GITHUB_REF_NAME"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle runnable
        run: chmod +x gradlew

      - name: Compile unsigned-for-release, debug-signed test APK
        run: |
          ./gradlew :app:assembleFullDebug \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -Xss4m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dorg.gradle.workers.max=4 \
            --stacktrace

      - name: Save debug APK as a GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaps-4-graph-test-debug-${{ github.run_number }}
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
