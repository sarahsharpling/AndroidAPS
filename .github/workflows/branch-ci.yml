# AAPS graph layout experiment: SIGNED update build for Samsung Virtual Pump only.
# On public fork: build APK artifacts are publicly viewable; keystore remains in Actions secrets.
name: Branch CI

on:
  workflow_dispatch:
    inputs:
      buildVariant:
        description: 'Build variant for AAPS graph test'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease

permissions:
  contents: read

jobs:
  build:
    name: Build signed AAPS graph test (Samsung only)
    if: github.ref == 'refs/heads/aaps-4-graph-test'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out chosen test branch
        uses: actions/checkout@v4

      - name: Check branch and variant
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'aaps-4-graph-test'
          test '${{ inputs.buildVariant }}' = 'fullRelease'
          echo "Building TEST source $(git rev-parse --short HEAD) on $GITHUB_REF_NAME"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Assemble fullRelease with existing signing key
        shell: bash
        env:
          # Support the existing AAPS fork's combined secret or the four separate secrets.
          EXISTING_KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          EXISTING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          EXISTING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EXISTING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EXISTING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          if [ -n "$EXISTING_KEYSTORE_SET" ]; then
            COMBINED="$(printf '%s' "$EXISTING_KEYSTORE_SET" | base64 --decode)"
            # Same four pipe-separated fields as the original AAPS branch-ci workflow.
            KEYSTORE_BASE64="${COMBINED%%|*}"
            REMAINDER="${COMBINED#*|}"
            KEYSTORE_PASSWORD="${REMAINDER%%|*}"
            REMAINDER="${REMAINDER#*|}"
            KEY_ALIAS="${REMAINDER%%|*}"
            KEY_PASSWORD="${REMAINDER#*|}"
            unset COMBINED REMAINDER
          else
            KEYSTORE_BASE64="$EXISTING_KEYSTORE_BASE64"
            KEYSTORE_PASSWORD="$EXISTING_KEYSTORE_PASSWORD"
            KEY_ALIAS="$EXISTING_KEY_ALIAS"
            KEY_PASSWORD="$EXISTING_KEY_PASSWORD"
          fi

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'ERROR: The existing AAPS signing key secrets are missing from this repository.' >&2
            echo 'Do not create a new key. Check Actions secrets or reuse your backed-up keystore.' >&2
            exit 1
          fi

          # Mask private values; never echo the secret or the keystore contents.
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"

          KEYSTORE_FILE="$RUNNER_TEMP/aaps-existing-signing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          chmod +x gradlew

          ./gradlew :app:assembleFullRelease \
            -Dorg.gradle.jvmargs='-Xmx6g -XX:+UseParallelGC -Xss4m' \
            -Dkotlin.daemon.jvm.options='-Xmx2g' \
            -Dorg.gradle.workers.max=4 \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

          # Immediately discard the keystore copy. It remains in GitHub secrets.
          rm -f "$KEYSTORE_FILE"

      - name: Verify APK signature, but not yet installation compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -f "$APK"
          SDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$SDK_BUILD_TOOLS"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          echo 'APK signature verified. Do not install on a live pump setup.'

      - name: Save signed APK to GitHub artifacts (PUBLIC on a public fork)
        uses: actions/upload-artifact@v4
        with:
          name: aaps-4-graph-test-signed-${{ github.run_number }}
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 7
